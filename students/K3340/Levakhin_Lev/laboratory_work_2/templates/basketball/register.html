<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | NBA West</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap'); body { font-family: 'Oswald', sans-serif; }</style>
</head>
<body class="bg-neutral-900 text-white min-h-screen flex items-center justify-center py-10">
    <div class="bg-neutral-800 p-8 border border-neutral-700 rounded-sm w-full max-w-md shadow-2xl">
        <h2 class="text-3xl font-bold uppercase tracking-widest text-center mb-2">Регистрация</h2>
        <p class="text-center text-gray-500 text-sm mb-8 tracking-widest uppercase">Присоединяйтесь к лиге</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
                <div>
                    <label class="block text-gray-400 text-xs uppercase tracking-widest mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <p class="text-gray-500 text-xs mt-1">{{ field.help_text }}</p>
                    {% endif %}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 uppercase tracking-widest transition mt-4">Создать аккаунт</button>
        </form>

        <p class="mt-6 text-center text-gray-400 text-sm">
            Уже есть аккаунт? <a href="{% url 'basketball:login' %}" class="text-red-500 hover:text-white transition uppercase tracking-wider">Войти</a>
        </p>
    </div>
</body>
</html>
