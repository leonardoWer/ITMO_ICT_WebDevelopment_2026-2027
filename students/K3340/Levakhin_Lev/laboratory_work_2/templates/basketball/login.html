<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | NBA West</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap'); body { font-family: 'Oswald', sans-serif; }</style>
</head>
<body class="bg-neutral-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-neutral-800 p-8 border border-neutral-700 rounded-sm w-full max-w-md shadow-2xl">
        <h2 class="text-3xl font-bold uppercase tracking-widest text-center mb-2">Вход</h2>
        <p class="text-center text-gray-500 text-sm mb-8 tracking-widest uppercase">Войдите, чтобы делать прогнозы</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="bg-red-900 text-red-200 p-2 text-sm border-l-4 border-red-500 mb-4">
                    {{ form.non_field_errors.0 }}
                </div>
            {% endif %}

            <div>
                <label class="block text-gray-400 text-xs uppercase tracking-widest mb-1">{{ form.username.label }}</label>
                {{ form.username }}
            </div>
            <div>
                <label class="block text-gray-400 text-xs uppercase tracking-widest mb-1">{{ form.password.label }}</label>
                {{ form.password }}
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 uppercase tracking-widest transition mt-4">Войти</button>
        </form>

        <p class="mt-6 text-center text-gray-400 text-sm">
            Нет аккаунта? <a href="{% url 'basketball:register' %}" class="text-red-500 hover:text-white transition uppercase tracking-wider">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
